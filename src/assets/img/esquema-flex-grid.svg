<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:28px;font-weight:800;fill:#141414}
    .s{font-size:20px;fill:#4a4743}
    .c{font-family:Menlo,Consolas,monospace;font-size:19px;fill:#141414}
    .b{stroke:#141414;stroke-width:4}
    .eje{stroke:#c8371e;stroke-width:5;stroke-linecap:round;fill:none}
  </style>
  <defs><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8371e"/></marker></defs>
  <rect width="900" height="520" fill="#fff"/>
  <path d="M450 30v460" stroke="#cbc6bd" stroke-width="2"/>
  <!-- flex -->
  <text class="t" x="30" y="62">Flexbox</text>
  <text class="s" x="30" y="92">Una dimensión: fila o columna</text>
  <rect class="b" x="30" y="130" width="390" height="130" rx="8" fill="#e7e4df"/>
  <rect class="b" x="48" y="150" width="70" height="90" rx="6" fill="#fff"/>
  <rect class="b" x="130" y="150" width="160" height="90" rx="6" fill="#c8371e"/>
  <rect class="b" x="302" y="150" width="100" height="90" rx="6" fill="#fff"/>
  <path class="eje" d="M40 290h360" marker-end="url(#p)"/>
  <text class="s" x="40" y="322">eje principal: justify-content</text>
  <rect x="30" y="360" width="390" height="120" rx="8" fill="#171513"/>
  <text class="c" x="52" y="400" style="fill:#ece8e1">display: flex;</text>
  <text class="c" x="52" y="430" style="fill:#ece8e1">gap: 1rem;</text>
  <text class="c" x="52" y="460" style="fill:#ef6a4f">flex: 1;</text>
  <text class="c" x="160" y="460" style="fill:#b3ada4">→ crece</text>
  <!-- grid -->
  <text class="t" x="480" y="62">Grid</text>
  <text class="s" x="480" y="92">Dos dimensiones: filas y columnas</text>
  <rect class="b" x="480" y="130" width="390" height="230" rx="8" fill="#e7e4df"/>
  <g stroke="#c8371e" stroke-width="2" stroke-dasharray="6 6"><path d="M612 130v230M738 130v230M480 245h390"/></g>
  <rect class="b" x="494" y="144" width="232" height="88" rx="6" fill="#c8371e"/>
  <rect class="b" x="750" y="144" width="106" height="202" rx="6" fill="#fff"/>
  <rect class="b" x="494" y="258" width="106" height="88" rx="6" fill="#fff"/>
  <rect class="b" x="624" y="258" width="102" height="88" rx="6" fill="#fff"/>
  <text x="610" y="196" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">ocupa 2 columnas</text>
  <rect x="480" y="380" width="390" height="100" rx="8" fill="#171513"/>
  <text class="c" x="500" y="420" style="fill:#ece8e1">display: grid;</text>
  <text class="c" x="500" y="452" style="fill:#ece8e1">grid-template-columns:</text>
  <text class="c" x="520" y="474" style="fill:#ef6a4f;font-size:17px">repeat(3, 1fr);</text>
</svg>
